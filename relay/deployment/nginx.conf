server {
    listen 80;
    server_name 193.112.25.170;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://193.112.25.170$request_uri; }
}
server {
    listen 443 ssl;
    server_name 193.112.25.170;
    ssl_certificate /etc/letsencrypt/live/193.112.25.170/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/193.112.25.170/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location /relay {
        proxy_pass http://relay:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_buffering off;
        access_log off;
    }
    location / { return 404; }
}
