name: Deploy to Server and GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: island-production
  cancel-in-progress: false

jobs:
  build-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run build
        env:
          SERVER_EXPORT: '0'
          NEXT_PUBLIC_CLOUD_API_URL: ${{ vars.SITE_URL }}
      - name: Stamp Pages release
        run: |
          test -f out/index.html
          printf '%s\n' "$GITHUB_SHA" > out/revision.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy-pages:
    needs: [build-pages, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify Pages release
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for attempt in $(seq 1 12); do
            status=$(curl --silent --show-error --max-time 20 --output /dev/null --write-out '%{http_code}' "$PAGES_URL") || status=000
            revision=$(curl --fail --silent --show-error --max-time 20 "${PAGES_URL%/}/revision.txt?sha=$GITHUB_SHA") || revision=''
            if [ "$status" = 200 ] && [ "$revision" = "$GITHUB_SHA" ]; then exit 0; fi
            sleep 5
          done
          echo 'Pages release verification failed'
          exit 1

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node scripts/test-cloud-save.mts
      - run: node scripts/test-multiplayer-connection.mts
      - run: node scripts/test-relay.mts
      - run: npm run build
        env:
          SERVER_EXPORT: '1'
          NEXT_PUBLIC_CLOUD_API_URL: ${{ vars.SITE_URL }}
      - name: Prepare release
        run: |
          test -f out/index.html
          tar --exclude='relay/node_modules' -czf release.tar.gz out server shared signaling relay
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/island
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          [[ "$DEPLOY_HOST" =~ ^[0-9.]+$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$DEPLOY_PATH" =~ ^/opt/[a-z0-9-]+$ ]]
      - name: Upload and deploy
        run: |
          ssh -i ~/.ssh/island -p "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH/releases/$GITHUB_SHA'"
          scp -i ~/.ssh/island -P "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes release.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/releases/$GITHUB_SHA/release.tar.gz"
          ssh -i ~/.ssh/island -p "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "cd '$DEPLOY_PATH/releases/$GITHUB_SHA' && tar -xzf release.tar.gz && docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v '$DEPLOY_PATH:$DEPLOY_PATH' -w '$DEPLOY_PATH/releases/$GITHUB_SHA' -e ISLAND_ROOT='$DEPLOY_PATH' -e REVISION='$GITHUB_SHA' node:22-alpine sh -c 'apk add --no-cache docker-cli docker-cli-compose >/dev/null && node --experimental-strip-types server/deploy.ts'"
      - name: Verify public release
        run: |
          test "$(curl --silent --show-error --max-time 30 --output /dev/null --write-out '%{http_code}' "$SITE_URL/")" = 200
          curl --fail --silent --show-error --max-time 30 "$SITE_URL/api/health" | jq -e --arg sha "$GITHUB_SHA" '.ok == true and .revision == $sha'
          node scripts/test-signaling-service.mts
      - name: Remove runner key
        if: always()
        run: rm -f ~/.ssh/island
