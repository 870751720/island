name: Deploy to Island Server

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: island-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node scripts/test-cloud-save.mts
      - run: npm run build
        env:
          SERVER_EXPORT: '1'
          NEXT_PUBLIC_CLOUD_API_URL: ${{ vars.SITE_URL }}
      - name: Prepare release
        run: |
          test -f out/index.html
          tar -czf release.tar.gz out server shared
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/island
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          [[ "$DEPLOY_HOST" =~ ^[0-9.]+$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$DEPLOY_PATH" =~ ^/opt/[a-z0-9-]+$ ]]
      - name: Upload and deploy
        run: |
          ssh -i ~/.ssh/island -p "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH/releases/$GITHUB_SHA'"
          scp -i ~/.ssh/island -P "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes release.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/releases/$GITHUB_SHA/release.tar.gz"
          ssh -i ~/.ssh/island -p "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "cd '$DEPLOY_PATH/releases/$GITHUB_SHA' && tar -xzf release.tar.gz && docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v '$DEPLOY_PATH:$DEPLOY_PATH' -w '$DEPLOY_PATH/releases/$GITHUB_SHA' -e ISLAND_ROOT='$DEPLOY_PATH' -e REVISION='$GITHUB_SHA' node:22-alpine sh -c 'apk add --no-cache docker-cli docker-cli-compose >/dev/null && node --experimental-strip-types server/deploy.ts'"
      - name: Verify public release
        run: |
          test "$(curl --silent --show-error --max-time 30 --output /dev/null --write-out '%{http_code}' "$SITE_URL/")" = 200
          curl --fail --silent --show-error --max-time 30 "$SITE_URL/api/health" | jq -e --arg sha "$GITHUB_SHA" '.ok == true and .revision == $sha'
      - name: Remove runner key
        if: always()
        run: rm -f ~/.ssh/island
