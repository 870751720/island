<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>物品图标方案预览</title>
<style>
  :root { --gold:#e8b04b; --ink:#4a3221; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif; background:#faf6ee; color:var(--ink); padding:16px 14px 96px; }
  header { max-width:760px; margin:0 auto 18px; }
  header h1 { font-size:20px; margin:0 0 6px; }
  header p { font-size:13px; line-height:1.7; margin:4px 0; color:#6b563e; }
  main { max-width:760px; margin:0 auto; }
  section { margin:0 0 26px; }
  .sec-head { display:flex; align-items:baseline; gap:10px; padding:8px 4px; border-bottom:2px solid #e9dfc9; margin-bottom:10px; }
  .sec-head h2 { font-size:17px; margin:0; }
  .sec-head .cur { font-size:13px; color:#9a8768; }
  .sec-head .lock { font-size:12px; color:#1e7a3c; background:#e3f2e6; padding:2px 8px; border-radius:99px; margin-left:8px; }
  .sec-head .picked { font-size:13px; color:#1e7a3c; font-weight:600; margin-left:auto; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(104px,1fr)); gap:10px; }
  .card { position:relative; background:#fff; border:2px solid #e9dfc9; border-radius:14px; padding:10px 6px 8px; cursor:pointer; font:inherit; color:inherit; display:flex; flex-direction:column; align-items:center; gap:4px; transition:transform .08s; }
  .card:active { transform:scale(.96); }
  .card .idx { position:absolute; top:6px; left:8px; font-size:11px; font-weight:700; color:#b3a184; }
  .card .art { width:72px; height:72px; }
  .card .art svg, .card .mini svg { width:100%; height:100%; display:block; }
  .card .mini { position:absolute; top:6px; right:8px; width:22px; height:22px; opacity:.85; }
  .card .lab { font-size:11px; color:#8a7658; }
  .card.sel { border-color:var(--gold); background:#fff9ec; box-shadow:0 0 0 2px rgba(232,176,75,.35); }
  .card.sel .idx { color:var(--gold); }
  .card.sel::after { content:"✓"; position:absolute; bottom:6px; right:8px; font-size:13px; font-weight:700; color:#1e7a3c; }
  #bar { position:fixed; left:0; right:0; bottom:0; background:#fffdf7; border-top:1px solid #e5d9bd; padding:10px 14px calc(10px + env(safe-area-inset-bottom)); }
  #bar .inner { max-width:760px; margin:0 auto; display:flex; align-items:center; gap:10px; }
  #count { font-size:14px; font-weight:700; white-space:nowrap; }
  #summary { flex:1; font-size:11px; color:#8a7658; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #bar button { border:none; border-radius:10px; padding:10px 16px; font-size:14px; font-weight:600; cursor:pointer; }
  #copyBtn { background:var(--gold); color:#fff; }
  #copyBtn:disabled { background:#d8cdb4; }
  #resetBtn { background:#efe7d2; color:#6b563e; }
  .toast { position:fixed; bottom:76px; left:50%; transform:translateX(-50%); background:#3e2f1c; color:#ffe9b8; font-size:13px; padding:8px 16px; border-radius:99px; opacity:0; transition:opacity .2s; pointer-events:none; }
  .toast.show { opacity:1; }
</style>
</head>
<body>
<header>
  <h1>物品图标方案预览（自绘 SVG · 黏土风）</h1>
  <p>每个物品 10 种方案，点卡片选中（每项选一个）。卡片右上角是缩小到 22px 的效果，用于判断游戏内小尺寸下的辨识度。</p>
  <p>第 4 轮：新增锁定 浆果·21、烤黄金鱼·16（共 12 个已定）。按反馈重做：虾 26–35、墨鱼 16–25 为全新画法；鸟肉 26–35 与兽肉同色系、个头更小；兽肉 26–35 骨头改横向；烤兽肉 26–35 烤签改横向。已定方案带「已选定」徽章，仍可改选。</p>
  <p>全部选完后点「复制选择」，把结果发给我，我再落到游戏里统一精修。</p>
</header>
<main id="app"></main>
<div id="bar">
  <div class="inner">
    <span id="count">已选 0/17</span>
    <span id="summary">还没选择</span>
    <button id="resetBtn" type="button">清空</button>
    <button id="copyBtn" type="button" disabled>复制选择</button>
  </div>
</div>
<div class="toast" id="toast"></div>

const EMOJI = { wood:'🪵', rope:'🧵', cloth:'🧶', berry:'🍒', cola:'🥤', colaZero:'🥤', shrimp:'🦐', puffer:'🐡', cuttlefish:'🦑', crabMeat:'🦀', birdMeat:'🐦', cookedBigFish:'🍡', cookedGoldenFish:'🌟', cookedCrabMeat:'🍤', cookedBirdMeat:'🍗', gameMeat:'🥩', cookedGameMeat:'🍖' };
const NOTES = { wood:'粗壮木段', rope:'纤维搓的细绳', cloth:'织机织的整幅布', berry:'灌木野果', cola:'海里钓上的易拉罐', colaZero:'无糖版', shrimp:'活蹦乱跳小虾', puffer:'鼓成球', cuttlefish:'扁扁的会喷墨', crabMeat:'剥出来的蟹肉(生)', birdMeat:'小块生鸟肉', cookedBigFish:'烤熟大鱼', cookedGoldenFish:'金光传说之鱼', cookedCrabMeat:'烤得通红', cookedBirdMeat:'外焦里嫩', gameMeat:'大块生兽肉', cookedGameMeat:'焦香大块' };
const pick = {};
const LOCKED = { wood: 0, rope: 2, cloth: 0, berry: 20, cola: 5, colaZero: 7, puffer: 11, crabMeat: 14, cookedBigFish: 13, cookedGoldenFish: 15, cookedCrabMeat: 6, cookedBirdMeat: 2 };
const app = document.getElementById('app');
ORDER.forEach(id => {
  const sec = document.createElement('section');
  const head = document.createElement('div');
  head.className = 'sec-head';
  head.innerHTML = `<h2>${NAMES[id]}</h2><span class="cur">${EMOJI[id]} ${NOTES[id]}</span><span class="picked" data-p="${id}"></span>`;
  sec.appendChild(head);
  const grid = document.createElement('div');
  grid.className = 'grid';
  ICONS[id].forEach((svg, i) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'card';
    btn.innerHTML = `<span class="idx">${i + 1}</span><div class="art">${svg}</div><div class="mini">${svg}</div><span class="lab">方案 ${i + 1}</span>`;
    btn.addEventListener('click', () => {
      if (pick[id] === i) { delete pick[id]; btn.classList.remove('sel'); }
      else {
        const prev = pick[id];
        pick[id] = i;
        btn.classList.add('sel');
        if (prev !== undefined) grid.children[prev].classList.remove('sel');
      }
      update();
    });
    grid.appendChild(btn);
  });
  sec.appendChild(grid);
  if (LOCKED[id] !== undefined) {
    const b = document.createElement('span');
    b.className = 'lock';
    b.textContent = '已选定';
    head.appendChild(b);
    pick[id] = LOCKED[id];
    grid.children[LOCKED[id]].classList.add('sel');
  }
  app.appendChild(sec);
});
update();
function update() {
  const n = Object.keys(pick).length;
  document.getElementById('count').textContent = `已选 ${n}/17`;
  document.getElementById('copyBtn').disabled = n === 0;
  document.getElementById('summary').textContent = n ? ORDER.filter(id => pick[id] !== undefined).map(id => `${NAMES[id]}:${pick[id] + 1}`).join(' ') : '还没选择';
  ORDER.forEach(id => {
    document.querySelector(`[data-p="${id}"]`).textContent = pick[id] !== undefined ? `✓ 方案 ${pick[id] + 1}` : '';
  });
}
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1600);
}
document.getElementById('copyBtn').addEventListener('click', async () => {
  const text = ORDER.filter(id => pick[id] !== undefined).map(id => `${NAMES[id]}:方案${pick[id] + 1}`).join(' ');
  try { await navigator.clipboard.writeText(text); toast('已复制，发给我就行'); }
  catch { 
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove(); toast('已复制，发给我就行');
  }
});
document.getElementById('resetBtn').addEventListener('click', () => {
  Object.keys(pick).forEach(k => delete pick[k]);
  document.querySelectorAll('.card.sel').forEach(c => c.classList.remove('sel'));
  update();
});
</script>
</body>
</html>
