<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图标选型 · 荒岛求生</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, "Microsoft YaHei", sans-serif; background: #f3ead8; color: #3a2f24; padding: 16px; }
  h1 { font-size: 20px; }
  p.tip { font-size: 13px; color: #7a6a52; margin: 4px 0 16px; }
  .item { margin-bottom: 28px; }
  .item h2 { font-size: 16px; border-left: 4px solid #b07b4a; padding-left: 8px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 10px; }
  .card {
    background: #fffdf6; border: 2px solid #d8c9a8; border-radius: 10px;
    padding: 8px 4px 6px; text-align: center; cursor: pointer; user-select: none;
    transition: transform .08s, border-color .08s, box-shadow .08s;
  }
  .card:hover { transform: translateY(-2px); }
  .card.selected { border-color: #e0702a; background: #fff3e2; box-shadow: 0 0 0 2px #e0702a55; }
  .card svg { width: 64px; height: 64px; display: block; margin: 0 auto; }
  .card .label { font-size: 11px; color: #7a6a52; margin-top: 2px; }
  #summary { position: sticky; bottom: 0; background: #3a2f24; color: #f3ead8; border-radius: 10px; padding: 10px 14px; font-size: 13px; margin-top: 20px; }
  #summary b { color: #ffb066; }
  #summary .empty::after { content: "（还没有选择，点击卡片选择）"; color: #b8a888; }
  #summary code { background: #00000030; padding: 1px 6px; border-radius: 4px; }
</style>
</head>
<body>
<h1>自绘图标选型(每项 18 种)</h1>
<p class="tip">点击卡片选中,底部汇总"物品 = 编号"。7 号起为新增方案;草系列为多配色。</p>
<div id="app"></div>
<div id="summary"><div class="empty"></div></div>

<script>
// ===== 通用调色 =====
const WOOD = '#b07b4a', WOOD_D = '#8a5a32', IRON = '#aab4bc', IRON_D = '#7d8790',
  IRON_DD = '#5a636b', STONE = '#9aa0a6', STONE_D = '#6f767c',
  PINK = '#e8a0a8', PINK_D = '#c97d87', SOIL = '#8a6238', SOIL_D = '#6b4a29',
  ROPE = '#c8a86a', RED = '#c0504a', RED_D = '#963a35', PAPER = '#f5ecd8', GOLD = '#e6b84c',
  LEAF_D = '#5e8c39';
// 金属色系(工具头)
const METALS = {
  iron: [IRON, IRON_D, IRON_DD],
  bronze: ['#c9964a', '#a5763a', '#7d5729'],
  stone: [STONE, STONE_D, '#565c62'],
  gold: ['#e6b84c', '#c29532', '#967021'],
  dark: ['#6a7078', '#4d535b', '#363b42'],
};
// 木柄色系
const WOODS = {
  wood: [WOOD, WOOD_D], dark: ['#8a5a32', '#6b4425'],
  pale: ['#c99a68', '#a5774a'], bamboo: ['#a8b06a', '#879150'],
};

// ===== 工具生成器:同一造型换角度/配色批量出方案 =====
const rot = (deg, body) => `<g transform="rotate(${deg} 32 32)">${body}</g>`;

function axeBody(m, w) {
  const [M, MD] = METALS[m], [W, WD] = WOODS[w];
  return `<rect x="30" y="12" width="5" height="48" rx="2.5" fill="${W}"/>
   <rect x="30" y="12" width="2" height="48" rx="1" fill="${WD}" opacity=".5"/>
   <path d="M32 8 L58 13 L53 27 L32 22 Z" fill="${M}"/>
   <path d="M32 8 L20 8 Q10 20 20 34 L32 22 Z" fill="${M}"/>
   <path d="M20 8 Q10 20 20 34" fill="none" stroke="${MD}" stroke-width="2"/>
   <rect x="29" y="8" width="8" height="16" fill="${MD}" opacity=".3"/>`;
}
function pickBody(m, w) {
  const [M, MD] = METALS[m], [W, WD] = WOODS[w];
  return `<rect x="30" y="14" width="5" height="46" rx="2.5" fill="${W}"/>
   <rect x="30" y="14" width="2" height="46" rx="1" fill="${WD}" opacity=".5"/>
   <path d="M6 22 Q32 0 58 22 L54 27 Q32 8 10 27 Z" fill="${M}"/>
   <rect x="28" y="12" width="9" height="7" fill="${MD}" opacity=".35"/>`;
}
function shovelBody(m, w) {
  const [M, MD] = METALS[m], [W, WD] = WOODS[w];
  return `<rect x="30" y="6" width="5" height="30" rx="2.5" fill="${W}"/>
   <rect x="30" y="6" width="2" height="30" rx="1" fill="${WD}" opacity=".5"/>
   <rect x="27" y="32" width="11" height="7" rx="1" fill="${MD}"/>
   <path d="M24 39 L40 39 L45 48 Q45 58 32 60 Q19 58 19 48 Z" fill="${M}"/>
   <path d="M24 44.5 L40 44.5" stroke="${MD}" stroke-width="1.5" opacity=".5"/>`;
}
function hoeBody(m, w) {
  const [M, MD] = METALS[m], [W, WD] = WOODS[w];
  return `<rect x="30" y="6" width="5" height="44" rx="2.5" fill="${W}"/>
   <rect x="30" y="6" width="2" height="44" rx="1" fill="${WD}" opacity=".5"/>
   <path d="M33 44 L16 37 Q5 37 8 51 L21 52 L33 52 Z" fill="${M}"/>
   <path d="M16 37 Q5 37 8 51" fill="none" stroke="${MD}" stroke-width="2"/>
   <rect x="29" y="42" width="8" height="11" fill="${MD}" opacity=".3"/>`;
}
function rodBody(w, line = '#e8e2d0') {
  const [W, WD] = WOODS[w];
  return `<path d="M14 56 L52 10" stroke="${WD}" stroke-width="4.5" stroke-linecap="round"/>
   <path d="M52 10 q-2 14 -6 22" fill="none" stroke="${line}" stroke-width="1.5"/>
   <path d="M46 32 q0 8 -6 10 q-6 2 -6 8" fill="none" stroke="${line}" stroke-width="1.5"/>
   <path d="M34 50 q-3 6 2 8 q5 2 5 -4" fill="none" stroke="${IRON}" stroke-width="2" stroke-linecap="round"/>`;
}
function bowBody(m, w, string = '#e8e2d0') {
  const [M] = METALS[m], [W, WD] = WOODS[w];
  return `<path d="M18 8 Q52 32 18 56" fill="none" stroke="${WD}" stroke-width="4" stroke-linecap="round"/>
   <path d="M18 8 L18 56" stroke="${string}" stroke-width="1.5"/>
   <path d="M10 32 L50 32" stroke="${W}" stroke-width="3" stroke-linecap="round"/>
   <polygon points="56,32 48,28 48,36" fill="${M}"/>`;
}
function swordBody(m, hilt) {
  const [M, MD] = METALS[m], [G, GD] = hilt === 'gold' ? ['#e6b84c', '#b98f2f'] : ['#c0504a', '#963a35'];
  return `<rect x="29" y="6" width="6" height="38" fill="${M}"/>
   <polygon points="32,2 28,10 36,10" fill="${M}" opacity=".9"/>
   <path d="M31 10 L31 42" stroke="#ffffff" stroke-width="1.4" opacity=".5"/>
   <rect x="18" y="44" width="28" height="6" rx="2" fill="${G}"/>
   <rect x="18" y="47" width="28" height="3" rx="1.5" fill="${GD}" opacity=".6"/>
   <rect x="28" y="50" width="8" height="9" rx="2" fill="#8a5a32"/>
   <circle cx="32" cy="60" r="3" fill="${G}"/>`;
}

const GRASS_PALETTES = {

  '苔绿': ['#7fae5e', '#5e8c44', '#466b32'],

  '紫藤': ['#a695c2', '#8a78a8', '#6b5c8a'],
  '玫粉': ['#d68fa8', '#b56e88', '#8e5268'],
  '棕褐': ['#b08a5e', '#8f6c45', '#6f5233'],
  '墨蓝': ['#7a8fa8', '#5c7188', '#43566a'],

const G = {
// 正面圆领上衣
shirt: (c, cd, cdd) => `<path d="M20 16 L44 16 L56 28 L48 34 L46 56 L18 56 L16 34 L8 28 Z" fill="${c}"/>
 <path d="M32 16 L32 56" stroke="${cd}" stroke-width="1.6"/>

// 背心
vest: (c, cd, cdd) => `<path d="M22 14 Q32 22 42 14 L52 26 L45 30 L44 56 L20 56 L19 30 L12 26 Z" fill="${c}"/>

tied: (c, cd, cdd) => `<path d="M20 16 L44 16 L54 26 L47 32 L45 54 L19 54 L17 32 L10 26 Z" fill="${c}"/>

// 披风
poncho: (c, cd, cdd) => `<path d="M24 12 L40 12 L52 54 L12 54 Z" fill="${c}"/>

// 叶片缀饰
leafy: (c, cd, cdd) => `<path d="M22 14 L42 14 L50 22 L46 52 L18 52 L14 22 Z" fill="${c}"/>
 <g fill="#7fae4e"><ellipse cx="24" cy="34" rx="3" ry="6" transform="rotate(20 24 34)"/><ellipse cx="40" cy="34" rx="3" ry="6" transform="rotate(-20 40 34)"/><ellipse cx="28" cy="46" rx="3" ry="6" transform="rotate(12 28 46)"/><ellipse cx="36" cy="46" rx="3" ry="6" transform="rotate(-12 36 46)"/></g>
 <path d="M27 14 q5 4 10 0" stroke="${cdd}" stroke-width="2" fill="none"/>`,
// 长袖
sleeved: (c, cd, cdd) => `<path d="M24 14 L40 14 L50 22 L58 40 L50 44 L45 32 L45 54 L19 54 L19 32 L14 44 L6 40 L14 22 Z" fill="${c}"/>
 <g stroke="${cd}" stroke-width="1.4"><path d="M24 24 l-4 12 M40 24 l4 12 M32 20 l0 30"/></g>

// 短打对襟
wrap: (c, cd, cdd) => `<path d="M18 14 L46 14 L50 24 L44 28 L46 52 L20 52 L22 28 L14 24 Z" fill="${c}"/>
 <path d="M18 14 L32 30 L46 14" fill="none" stroke="${cdd}" stroke-width="2"/>
 <path d="M32 30 L32 52" stroke="${cdd}" stroke-width="1.6"/>
 <g stroke="${cd}" stroke-width="1.4"><path d="M24 34 l-1 14 M40 34 l1 14"/></g>`,
// 高领斗篷
hooded: (c, cd, cdd) => `<path d="M22 18 L42 18 L54 34 L47 38 L45 56 L19 56 L17 38 L10 34 Z" fill="${c}"/>
 <path d="M22 18 Q32 2 42 18" fill="${cd}"/>
 <path d="M25 18 Q32 8 39 18" fill="${cdd}" opacity=".4"/>
 <path d="M32 40 l0 12 M25 44 l14 0" stroke="${ROPE}" stroke-width="2" stroke-linecap="round"/>`,
};
const P = {
// 经典长裤
pants: (c, cd, cdd) => `<path d="M18 10 L46 10 L44 54 L34 54 L32 32 L30 54 L20 54 Z" fill="${c}"/>
 <rect x="18" y="10" width="28" height="6" fill="${cd}"/>
 <g stroke="${cd}" stroke-width="1.4"><path d="M24 20 l-1 30 M40 20 l1 30"/></g>
 <path d="M18 10 h28" stroke="${ROPE}" stroke-width="2.5"/>`,
// 短裤
shorts: (c, cd, cdd) => `<path d="M18 16 L46 16 L44 42 L34 42 L32 28 L30 42 L20 42 Z" fill="${c}"/>
 <rect x="18" y="16" width="28" height="6" fill="${cd}"/>
 <path d="M24 26 l-1 12 M40 26 l1 12" stroke="${cd}" stroke-width="1.4"/>
 <path d="M18 16 h28" stroke="${ROPE}" stroke-width="2.5"/>`,
// 背带裤
overall: (c, cd, cdd) => `<path d="M18 16 L46 16 L44 54 L34 54 L32 34 L30 54 L20 54 Z" fill="${c}"/>
 <g stroke="${cd}" stroke-width="1.4"><path d="M25 24 l-1 26 M39 24 l1 26"/></g>
 <path d="M22 16 L18 6 M42 16 L46 6" stroke="${ROPE}" stroke-width="3" stroke-linecap="round"/>
 <rect x="15" y="4" width="7" height="5" rx="2" fill="${cdd}"/><rect x="42" y="4" width="7" height="5" rx="2" fill="${cdd}"/>`,
// 灯笼裤
bloomer: (c, cd, cdd) => `<path d="M20 14 Q10 30 16 52 L28 52 Q26 36 30 30 Q34 36 32 52 L44 52 Q50 30 40 14 Z" fill="${c}"/>
 <rect x="20" y="14" width="20" height="5" fill="${cd}"/>
 <path d="M20 14 h20" stroke="${ROPE}" stroke-width="2.5"/>
 <path d="M18 44 q10 4 24 0" stroke="${cd}" stroke-width="1.6" fill="none"/>`,
// 缀叶裤
leafPants: (c, cd, cdd) => `<path d="M18 12 L46 12 L44 54 L34 54 L32 32 L30 54 L20 54 Z" fill="${c}"/>
 <rect x="18" y="12" width="28" height="5" fill="${cd}"/>
 <g fill="#7fae4e"><ellipse cx="26" cy="24" rx="2.5" ry="5" transform="rotate(15 26 24)"/><ellipse cx="38" cy="24" rx="2.5" ry="5" transform="rotate(-15 38 24)"/><ellipse cx="26" cy="46" rx="2.5" ry="5" transform="rotate(10 26 46)"/><ellipse cx="38" cy="46" rx="2.5" ry="5" transform="rotate(-10 38 46)"/></g>`,
// 侧视裤
sidePants: (c, cd, cdd) => `<path d="M16 12 L44 12 L48 34 L40 36 L38 22 L36 54 L26 54 L28 36 L12 38 Z" fill="${c}"/>
 <rect x="16" y="12" width="28" height="6" fill="${cd}"/>
 <g stroke="${cd}" stroke-width="1.4"><path d="M24 22 l-6 12 M36 22 l6 12"/></g>`,
// 卷边裤
cuffed: (c, cd, cdd) => `<path d="M18 12 L46 12 L44 48 L34 48 L32 30 L30 48 L20 48 Z" fill="${c}"/>
 <rect x="18" y="12" width="28" height="5" fill="${cd}"/>
 <rect x="18" y="44" width="13" height="5" fill="${cd}"/><rect x="33" y="44" width="13" height="5" fill="${cd}"/>
 <g stroke="${cdd}" stroke-width="1.2"><path d="M25 20 l-1 22 M39 20 l1 22"/></g>`,
// 宽松束脚裤
tiePants: (c, cd, cdd) => `<path d="M19 12 L45 12 L47 34 Q47 46 41 52 L34 52 Q38 40 32 32 Q26 40 30 52 L23 52 Q17 46 17 34 Z" fill="${c}"/>
 <rect x="19" y="12" width="26" height="5" fill="${cd}"/>
 <path d="M23 50 h7 M34 50 h7" stroke="${ROPE}" stroke-width="2.2" stroke-linecap="round"/>`,
// 补丁裤
patch: (c, cd, cdd) => `<path d="M18 12 L46 12 L44 54 L34 54 L32 32 L30 54 L20 54 Z" fill="${c}"/>
 <rect x="18" y="12" width="28" height="5" fill="${cd}"/>
 <rect x="21" y="24" width="8" height="8" rx="1" fill="${cd}" stroke="${cdd}" stroke-width="1" stroke-dasharray="2 1.6"/>
 <rect x="36" y="40" width="7" height="7" rx="1" fill="${cd}" stroke="${cdd}" stroke-width="1" stroke-dasharray="2 1.6"/>`,
};
const H = {
// 宽檐侧视
wide: (c, cd, cdd) => `<ellipse cx="32" cy="40" rx="28" ry="8" fill="${cd}"/>
 <path d="M14 40 Q32 10 50 40 Z" fill="${c}"/>
 <path d="M14 38 q18 -6 36 0" fill="none" stroke="${cdd}" stroke-width="2"/>
 <path d="M18 34 q14 -8 28 0" stroke="${cdd}" stroke-width="1.4" fill="none" opacity=".6"/>`,
// 圆锥斗笠
cone: (c, cd, cdd) => `<polygon points="32,8 56,48 8,48" fill="${c}"/>
 <path d="M14 44 q18 8 36 0" fill="none" stroke="${cd}" stroke-width="3"/>
 <path d="M20 38 q12 6 24 0 M25 28 q7 4 14 0" stroke="${cdd}" stroke-width="1.4" fill="none" opacity=".6"/>
 <circle cx="32" cy="8" r="2.5" fill="${cd}"/>`,
// 系带圆帽
ribbon: (c, cd, cdd) => `<ellipse cx="32" cy="40" rx="26" ry="7" fill="${cd}"/>
 <path d="M15 40 Q32 12 49 40 Z" fill="${c}"/>
 <path d="M16.5 35 q15.5 -7 31 0 l0 5 q-15.5 -7 -31 0 Z" fill="${'#c0504a'}"/>
 <circle cx="32" cy="33" r="2.5" fill="${'#e6b84c'}"/>`,
// 平顶水手帽
sailor: (c, cd, cdd) => `<ellipse cx="32" cy="42" rx="24" ry="6" fill="${cd}"/>
 <path d="M12 42 L12 30 Q32 22 52 30 L52 42 Z" fill="${c}"/>
 <ellipse cx="32" cy="30" rx="20" ry="5" fill="${c}" opacity=".55"/>
 <path d="M13 36 q19 -6 38 0" stroke="${cdd}" stroke-width="1.6" fill="none" opacity=".7"/>`,
// 俯视织纹
top: (c, cd, cdd) => `<circle cx="32" cy="32" r="26" fill="${cd}"/>
 <circle cx="32" cy="32" r="12" fill="${c}"/>
 <g stroke="${cdd}" stroke-width="1.2" fill="none" opacity=".7"><circle cx="32" cy="32" r="17"/><circle cx="32" cy="32" r="22"/></g>
 <circle cx="32" cy="32" r="5" fill="${cd}"/>`,
// 下巴带
strap: (c, cd, cdd) => `<ellipse cx="32" cy="34" rx="27" ry="8" fill="${cd}"/>
 <path d="M15 34 Q32 6 49 34 Z" fill="${c}"/>
 <path d="M16 30 q16 -6 32 0" fill="none" stroke="${cdd}" stroke-width="1.6"/>
 <path d="M18 38 q-2 12 8 14 M46 38 q2 12 -8 14" fill="none" stroke="${ROPE}" stroke-width="2"/>`,
// 尖顶渔夫帽
baker: (c, cd, cdd) => `<ellipse cx="32" cy="42" rx="22" ry="7" fill="${cd}"/>
 <path d="M14 42 Q18 16 32 16 Q46 16 50 42 Z" fill="${c}"/>
 <path d="M15 36 q17 -5 34 0" stroke="${cdd}" stroke-width="1.6" fill="none" opacity=".7"/>
 <circle cx="32" cy="16" r="2.5" fill="${cd}"/>`,

soft: (c, cd, cdd) => `<ellipse cx="32" cy="44" rx="25" ry="8" fill="${cd}"/>
 <path d="M15 44 Q20 18 32 18 Q44 18 49 44 Z" fill="${c}"/>
 <path d="M16 40 q16 8 32 0 l0 -6 q-16 6 -32 0 Z" fill="${cd}" opacity=".7"/>`,
};
const B = {
// 提篮包
basket: (c, cd, cdd) => `<path d="M8 54 L12 26 L52 26 L56 54 Z" fill="${c}"/>
 <path d="M8 54 L56 54 L55 58 L9 58 Z" fill="${cd}"/>
 <path d="M20 26 q12 -20 24 0" fill="none" stroke="${WOOD_D}" stroke-width="4"/>
 <g stroke="${cd}" stroke-width="1.6"><path d="M14 34 h36 M13 42 h38 M12 50 h40"/></g>`,

pouch: (c, cd, cdd) => `<path d="M14 26 Q10 56 32 58 Q54 56 50 26 Z" fill="${c}"/>
 <path d="M14 26 Q32 32 50 26" fill="none" stroke="${ROPE}" stroke-width="3"/>
 <path d="M40 24 l6 -8" stroke="${ROPE}" stroke-width="2.5" stroke-linecap="round"/>
 <g stroke="${cd}" stroke-width="1.4"><path d="M20 36 l-2 12 M32 38 l0 12 M44 36 l2 12"/></g>`,
// 双肩包
backpack: (c, cd, cdd) => `<rect x="14" y="20" width="36" height="36" rx="8" fill="${c}"/>
 <rect x="14" y="20" width="36" height="10" rx="5" fill="${cd}"/>
 <path d="M22 20 q2 -12 10 -12 q8 0 10 12" fill="none" stroke="${WOOD_D}" stroke-width="3.5"/>
 <circle cx="32" cy="34" r="3" fill="${cdd}"/>
 <g stroke="${cd}" stroke-width="1.4"><path d="M18 44 h28 M22 50 h20"/></g>`,

 <path d="M12 28 L52 28 L50 38 L14 38 Z" fill="${cd}"/>

bundle: (c, cd, cdd) => `<rect x="10" y="30" width="34" height="22" rx="8" fill="${c}"/>
 <path d="M44 32 L58 14" stroke="${WOOD}" stroke-width="4" stroke-linecap="round"/>
 <g stroke="${ROPE}" stroke-width="2"><path d="M18 30 v22 M28 30 v22 M38 30 v22"/></g>`,

 <rect x="12" y="24" width="40" height="8" rx="4" fill="${cd}"/>
 <rect x="27" y="32" width="10" height="7" rx="2" fill="${cdd}"/>
 <path d="M10 22 q22 -12 44 0 l-4 4 h-36 Z" fill="${cd}"/>
 <g stroke="${cd}" stroke-width="1.3"><path d="M16 42 h32 M16 49 h32"/></g>`,

net: (c, cd, cdd) => `<path d="M18 22 L46 22 L52 52 L12 52 Z" fill="${c}"/>
 <path d="M22 22 q10 -16 20 0" fill="none" stroke="${WOOD_D}" stroke-width="3.5"/>
 <g stroke="${cdd}" stroke-width="1.3" fill="none"><path d="M20 30 h24 M17 40 h30 M14 50 h34 M24 22 l-4 30 M32 22 l0 30 M40 22 l4 30"/></g>`,

roll: (c, cd, cdd) => `<rect x="14" y="22" width="36" height="22" rx="11" fill="${c}"/>
 <ellipse cx="50" cy="33" rx="5" ry="11" fill="${cd}"/>
 <g stroke="${cdd}" stroke-width="1.4"><path d="M24 22 v22 M34 22 v22"/></g>

// 草系列:18 = 形状×配色组合
const grassItem = (shapes, order) => order.map(([shape, pal]) => {
  const [c, cd, cdd] = GRASS_PALETTES[pal];
  return shapes[shape](c, cd, cdd);
});
ITEMS['草衣'] = grassItem(G, [
 ['shirt','草黄'],['vest','嫩绿'],['poncho','苔绿'],['tied','草黄'],['leafy','苔绿'],['sleeved','草黄'],
 ['wrap','嫩绿'],['hooded','海沫青'],['shirt','天蓝'],['vest','暖橙'],['poncho','砖红'],['tied','紫藤'],
 ['leafy','灰白'],['sleeved','玫粉'],['wrap','棕褐'],['hooded','墨蓝'],['tied','海沫青'],['shirt','苔绿'],
]);
ITEMS['草裤'] = grassItem(P, [
 ['pants','草黄'],['shorts','嫩绿'],['overall','草黄'],['bloomer','暖橙'],['leafPants','苔绿'],['sidePants','草黄'],
 ['cuffed','天蓝'],['tiePants','砖红'],['patch','嫩绿'],['pants','紫藤'],['shorts','海沫青'],['overall','墨蓝'],
 ['bloomer','灰白'],['leafPants','草黄'],['sidePants','暖橙'],['cuffed','玫粉'],['tiePants','苔绿'],['patch','棕褐'],
]);
ITEMS['草帽'] = grassItem(H, [
 ['wide','草黄'],['cone','草黄'],['ribbon','草黄'],['sailor','草黄'],['top','草黄'],['strap','草黄'],
 ['baker','嫩绿'],['soft','暖橙'],['wide','海沫青'],['cone','砖红'],['ribbon','天蓝'],['sailor','紫藤'],
 ['top','灰白'],['strap','玫粉'],['baker','墨蓝'],['soft','苔绿'],['wide','嫩绿'],['cone','暖橙'],
]);
ITEMS['草包'] = grassItem(B, [
 ['basket','草黄'],['pouch','草黄'],['backpack','草黄'],['flap','草黄'],['bundle','草黄'],['box','草黄'],
 ['net','嫩绿'],['roll','暖橙'],['basket','海沫青'],['pouch','砖红'],['backpack','天蓝'],['flap','紫藤'],
 ['box','灰白'],['bundle','玫粉'],['net','墨蓝'],['roll','苔绿'],['basket','砖红'],['pouch','墨蓝'],
]);

// ===== 渲染 =====
const app = document.getElementById('app');
const summary = document.getElementById('summary');
const chosen = {};
const PALETTE_LABEL = Object.keys(GRASS_PALETTES);

for (const [name, svgs] of Object.entries(ITEMS)) {
  const sec = document.createElement('div');
  sec.className = 'item';
  const h = document.createElement('h2');
  h.textContent = name;
  sec.appendChild(h);
  const grid = document.createElement('div');
  grid.className = 'grid';
  const isGrass = ['草衣','草裤','草帽','草包'].includes(name);
  const grassOrder = { '草衣': [['shirt','草黄'],['vest','嫩绿'],['poncho','苔绿'],['tied','草黄'],['leafy','苔绿'],['sleeved','草黄'],['wrap','嫩绿'],['hooded','海沫青'],['shirt','天蓝'],['vest','暖橙'],['poncho','砖红'],['tied','紫藤'],['leafy','灰白'],['sleeved','玫粉'],['wrap','棕褐'],['hooded','墨蓝'],['tied','海沫青'],['shirt','苔绿']],
   '草裤': null, '草帽': null, '草包': null };
  svgs.forEach((body, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    let sub = `方案 ${i + 1}`;
    if (isGrass && grassOrder[name]) sub += ` · ${grassOrder[name][i][1]}`;
    card.innerHTML = `<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">${body}</svg><div class="label">${sub}</div>`;
    card.onclick = () => {
      if (chosen[name] === card) { delete chosen[name]; card.classList.remove('selected'); }
      else {
        if (chosen[name]) chosen[name].classList.remove('selected');
        chosen[name] = card; card.classList.add('selected');
      }
      renderSummary();
    };
    grid.appendChild(card);
  });
  sec.appendChild(grid);
  app.appendChild(sec);
}

function renderSummary() {
  const entries = Object.entries(chosen);
  if (!entries.length) { summary.innerHTML = '<div class="empty"></div>'; return; }
  const names = Object.keys(ITEMS);
  summary.innerHTML = '已选:<br>' + entries.map(([n, c]) => {
    const idx = [...c.parentElement.children].indexOf(c) + 1;
    return `<b>${n}</b> = <code>${idx}号</code>`;
  }).join('　') + '<br>未选:' + names.filter(n => !chosen[n]).join('、');
}
