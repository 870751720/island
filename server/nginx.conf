server {
    listen 80;
    server_name 43.110.116.98;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://43.110.116.98$request_uri; }
}
server {
    listen 443 ssl;
    server_name 43.110.116.98;
    ssl_certificate /etc/letsencrypt/live/43.110.116.98/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/43.110.116.98/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 10m;
    client_body_timeout 30s;
    root /usr/share/nginx/web/current;
    index index.html;
    location /relay {
        proxy_pass http://relay:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_buffering off;
        access_log off;
    }
    location = /signaling {
        proxy_pass http://signaling:9001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_buffering off;
        access_log off;
    }
    location /api/ {
        proxy_pass http://api:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 35s;
        # Never log authorization or request bodies.
        access_log off;
    }
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/ =404;
    }
}
