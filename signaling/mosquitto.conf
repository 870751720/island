# Ephemeral room discovery and WebRTC SDP/ICE exchange only.
persistence false
retain_available false
allow_anonymous true
acl_file /mosquitto/config/acl
message_size_limit 32768
max_packet_size 65536
max_queued_messages 32
max_queued_bytes 131072
memory_limit 67108864
connection_messages false
log_dest stdout
log_type error
log_type warning

# Accessible only from the Docker network through the HTTPS proxy.
listener 9001
protocol websockets
socket_domain ipv4
max_connections 512

# Container-local health checks; never published to the host.
listener 1883 127.0.0.1
protocol mqtt
max_connections 4
